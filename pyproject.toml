[project]
name = "project-template"
version = "0.1.0"
description = "AI development project template"
requires-python = ">=3.12"

dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "-o python_files=test_*.py --no-empty-collect"
